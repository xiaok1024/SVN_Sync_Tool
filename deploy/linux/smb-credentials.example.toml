# E9 共享目录 SMB 凭据示例。真实文件含明文密码，禁止提交 Git。
#
# 部署位置：服务所在主机的 /root/.config/svn_sync_tool/smb-credentials.toml（0600）
# 按角色分两组即可——三台历史文件主机（.108 / .173 / .106）共用同一套 history 账号。

[standard]
# \\192.168.7.215\ECOLOGY_customer —— 标准文件（源 KB 到目标 KB 的差异包）
username = "test"
password = "REPLACE_ME"

[history]
# \\192.168.7.108 \ .173 \ .106 —— 历史文件，三台共用此账号
username = "test"
password = "REPLACE_ME"
